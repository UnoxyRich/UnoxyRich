<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">工具与技术</title>
  <desc id="desc">构建、自动化、部署和创作使用的工具</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#78f0be"/>
      <stop offset="1" stop-color="#75d9ff"/>
    </linearGradient>
    <linearGradient id="pillGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#153a32"/>
      <stop offset="1" stop-color="#102b31"/>
    </linearGradient>
    <linearGradient id="pillBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#123344"/>
      <stop offset="1" stop-color="#102a32"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="1197" height="507" rx="28" fill="#07131a" fill-opacity="0.9" stroke="url(#border)" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="62" y="69" fill="#b8f7d4" font-size="31" font-weight="750">工具与技术</text>
    <text x="62" y="100" fill="#8ed6f2" font-size="16">从快速原型到跨平台交付，再到视觉创作。</text>
    <line x1="62" y1="122" x2="1138" y2="122" stroke="#83e8cc" stroke-opacity="0.24"/>

    <text x="62" y="166" fill="#b8f7d4" font-size="18" font-weight="700">构建</text>
    <g transform="translate(150 142)" font-size="16" font-weight="650">
      <g><rect width="150" height="46" rx="15" fill="url(#pillGreen)" stroke="#77e8b8" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#76e8b9"/><text x="23" y="28" text-anchor="middle" fill="#09241a" font-size="11" font-weight="800">TS</text><text x="45" y="29" fill="#b8f7d4">TypeScript</text></g>
      <g transform="translate(162)"><rect width="150" height="46" rx="15" fill="url(#pillBlue)" stroke="#73d2ff" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#74d4ff"/><text x="23" y="28" text-anchor="middle" fill="#08202a" font-size="11" font-weight="800">JS</text><text x="45" y="29" fill="#a9ddff">JavaScript</text></g>
      <g transform="translate(324)"><rect width="140" height="46" rx="15" fill="url(#pillGreen)" stroke="#77e8b8" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#76e8b9"/><text x="23" y="28" text-anchor="middle" fill="#09241a" font-size="11" font-weight="800">PY</text><text x="45" y="29" fill="#b8f7d4">Python</text></g>
      <g transform="translate(476)"><rect width="120" height="46" rx="15" fill="url(#pillBlue)" stroke="#73d2ff" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#74d4ff"/><text x="23" y="28" text-anchor="middle" fill="#08202a" font-size="11" font-weight="800">V</text><text x="45" y="29" fill="#a9ddff">Vue</text></g>
      <g transform="translate(608)"><rect width="140" height="46" rx="15" fill="url(#pillGreen)" stroke="#77e8b8" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#76e8b9"/><text x="23" y="28" text-anchor="middle" fill="#09241a" font-size="10" font-weight="800">EL</text><text x="45" y="29" fill="#b8f7d4">Electron</text></g>
      <g transform="translate(760)"><rect width="168" height="46" rx="15" fill="url(#pillBlue)" stroke="#73d2ff" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#74d4ff"/><text x="23" y="28" text-anchor="middle" fill="#08202a" font-size="10" font-weight="800">TW</text><text x="45" y="29" fill="#a9ddff">Tailwind CSS</text></g>
    </g>

    <text x="62" y="259" fill="#a9ddff" font-size="18" font-weight="700">自动化与部署</text>
    <g transform="translate(206 235)" font-size="16" font-weight="650">
      <g><rect width="172" height="46" rx="15" fill="url(#pillBlue)" stroke="#73d2ff" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#74d4ff"/><text x="23" y="28" text-anchor="middle" fill="#08202a" font-size="10" font-weight="800">PW</text><text x="45" y="29" fill="#a9ddff">Playwright</text></g>
      <g transform="translate(184)"><rect width="236" height="46" rx="15" fill="url(#pillGreen)" stroke="#77e8b8" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#76e8b9"/><text x="23" y="28" text-anchor="middle" fill="#09241a" font-size="9" font-weight="800">CF</text><text x="45" y="29" fill="#b8f7d4">Cloudflare Workers</text></g>
      <g transform="translate(432)"><rect width="212" height="46" rx="15" fill="url(#pillBlue)" stroke="#73d2ff" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#74d4ff"/><text x="23" y="28" text-anchor="middle" fill="#08202a" font-size="9" font-weight="800">GH</text><text x="45" y="29" fill="#a9ddff">GitHub Actions</text></g>
    </g>

    <text x="62" y="352" fill="#b8f7d4" font-size="18" font-weight="700">创作与工作</text>
    <g transform="translate(180 328)" font-size="16" font-weight="650">
      <g><rect width="168" height="46" rx="15" fill="url(#pillGreen)" stroke="#77e8b8" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#76e8b9"/><text x="23" y="28" text-anchor="middle" fill="#09241a" font-size="9" font-weight="800">VS</text><text x="45" y="29" fill="#b8f7d4">VS Code</text></g>
      <g transform="translate(180)"><rect width="198" height="46" rx="15" fill="url(#pillBlue)" stroke="#73d2ff" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#74d4ff"/><text x="23" y="28" text-anchor="middle" fill="#08202a" font-size="9" font-weight="800">AE</text><text x="45" y="29" fill="#a9ddff">After Effects</text></g>
      <g transform="translate(390)"><rect width="202" height="46" rx="15" fill="url(#pillGreen)" stroke="#77e8b8" stroke-opacity="0.38"/><circle cx="23" cy="23" r="12" fill="#76e8b9"/><text x="23" y="28" text-anchor="middle" fill="#09241a" font-size="9" font-weight="800">PR</text><text x="45" y="29" fill="#b8f7d4">Premiere Pro</text></g>
    </g>

    <rect x="62" y="420" width="1076" height="1" fill="#83e8cc" fill-opacity="0.18"/>
    <text x="600" y="462" text-anchor="middle" fill="#91cfd9" font-size="15">快速试验 · 清晰设计 · 可靠交付</text>
  </g>
